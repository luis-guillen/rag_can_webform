# Stack completo del RAG para Dell Pro Max (NVIDIA GB10 / DGX Spark).
#
#   docker compose build api
#   docker compose up -d qdrant ollama
#   docker compose exec ollama ollama pull qwen2.5:14b-instruct
#   docker compose run --rm api bash -lc "python -m app.validate_corpus && python -m app.chunk && python -m app.embed_index --recreate"
#   docker compose up -d api
#
# Requiere nvidia-container-toolkit en el host (DGX OS suele traerlo).

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks: [ragnet]
    # Descomenta para ver el dashboard de Qdrant desde el host:
    # ports: ["6333:6333"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama_models:/root/.ollama
    networks: [ragnet]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGC_TAG: ${NGC_TAG:-25.11-py3}
    restart: unless-stopped
    depends_on: [qdrant, ollama]
    env_file: .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # DNS de servicio: sobreescriben cualquier valor localhost del .env.
      - QDRANT_URL=http://qdrant:6333
      - RAG_LLM_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      # Corpus de solo lectura montado desde el host (ruta configurable).
      - ${RAG_CORPUS_HOST_DIR:-./corpus}:/data/corpus:ro
      # chunks.jsonl y artefactos generados.
      - rag_data:/app/data
      # Cache del modelo de embeddings (no re-descargar en cada arranque).
      - hf_cache:/models/hf
    networks: [ragnet]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ragnet:

volumes:
  qdrant_storage:
  ollama_models:
  rag_data:
  hf_cache:
